<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#627d8f"/></marker></defs><rect width="1100" height="670" fill="white"/><g font-family="sans-serif"><text x="45" y="58" font-size="32" fill="#183248" font-weight="700">元記事の基本形に、何を足したか</text><text x="45" y="94" font-size="20" fill="#526e81" font-weight="400">nomolk氏の記事にも、感想の反映・発売通知・曲名照合はある</text><rect x="45" y="135" width="1010" height="120" rx="18" fill="#eaf4ef"/><text x="69" y="175" font-size="25" fill="#183248" font-weight="700">基本形  ニュースを読む ＋ 対応する曲を聴く</text><text x="69" y="213" font-size="19" fill="#183248" font-weight="400">毎朝5〜10件の音楽情報と、Spotifyプレイリスト</text><rect x="45" y="285" width="485" height="150" rx="18" fill="#edf3f8"/><text x="69" y="325" font-size="25" fill="#183248" font-weight="700">① 聴いた後を読む</text><text x="69" y="363" font-size="19" fill="#183248" font-weight="400">自作Last.fm MCPで実聴取を参照</text><text x="69" y="392" font-size="19" fill="#183248" font-weight="400">保存・感想・再訪を分けて扱う</text><rect x="570" y="285" width="485" height="150" rx="18" fill="#edf3f8"/><text x="594" y="325" font-size="25" fill="#183248" font-weight="700">② 好みを育てる</text><text x="594" y="363" font-size="19" fill="#183248" font-weight="400">Cosenseに原文・観測・解釈を保存</text><text x="594" y="392" font-size="19" fill="#183248" font-weight="400">長年の好みと、一度の好反応を区別</text><rect x="45" y="465" width="485" height="150" rx="18" fill="#edf3f8"/><text x="69" y="505" font-size="25" fill="#183248" font-weight="700">③ 聴ける状態にする</text><text x="69" y="543" font-size="19" fill="#183248" font-weight="400">実収録・紹介順・ライブラリ保存を確認</text><text x="69" y="572" font-size="19" fill="#183248" font-weight="400">固定名とカバーで見つけやすくする</text><rect x="570" y="465" width="485" height="150" rx="18" fill="#edf3f8"/><text x="594" y="505" font-size="25" fill="#183248" font-weight="700">④ 埋もれないようにする</text><text x="594" y="543" font-size="19" fill="#183248" font-weight="400">未試聴の便が続いたら新規配信を休む</text><text x="594" y="572" font-size="19" fill="#183248" font-weight="400">全曲アーカイブ ＋ 厳選した聴き返し</text></g></svg>