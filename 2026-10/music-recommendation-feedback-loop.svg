<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#627d8f"/></marker></defs><rect width="1100" height="670" fill="white"/><g font-family="sans-serif"><text x="45" y="58" font-size="32" fill="#183248" font-weight="700">AIの推薦と、人間のフィードバック</text><text x="45" y="94" font-size="20" fill="#526e81" font-weight="400">推薦のたびに、本人の反応と実際の聴取を読み直す</text><rect x="45" y="135" width="310" height="145" rx="18" fill="#edf3f8"/><text x="69" y="175" font-size="25" fill="#183248" font-weight="700">1  材料を読む</text><text x="69" y="213" font-size="19" fill="#183248" font-weight="400">音楽ニュース</text><text x="69" y="242" font-size="19" fill="#183248" font-weight="400">Cosenseの好み・過去の反応</text><rect x="395" y="135" width="310" height="145" rx="18" fill="#eaf4ef"/><text x="419" y="175" font-size="25" fill="#183248" font-weight="700">2  AIが推薦する</text><text x="419" y="213" font-size="19" fill="#183248" font-weight="400">短い説明と、実在する曲</text><text x="419" y="242" font-size="19" fill="#183248" font-weight="400">Spotifyの曲入り日次便</text><rect x="745" y="135" width="310" height="145" rx="18" fill="#fff0e5"/><text x="769" y="175" font-size="25" fill="#183248" font-weight="700">3  本人が聴く</text><text x="769" y="213" font-size="19" fill="#183248" font-weight="400">読む → 聴く → 感想を返す</text><text x="769" y="242" font-size="19" fill="#183248" font-weight="400">Likedは曲への明確な肯定</text><path d="M355 205H382" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M705 205H732" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M900 280V327" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="745" y="340" width="310" height="145" rx="18" fill="#edf3f8"/><text x="769" y="380" font-size="25" fill="#183248" font-weight="700">4  聴取を観測する</text><text x="769" y="418" font-size="19" fill="#183248" font-weight="400">自作Last.fm MCP</text><text x="769" y="447" font-size="19" fill="#183248" font-weight="400">曲・時刻・反復・再訪</text><rect x="395" y="340" width="310" height="145" rx="18" fill="#fff0e5"/><text x="419" y="380" font-size="25" fill="#183248" font-weight="700">5  記録を更新する</text><text x="419" y="418" font-size="19" fill="#183248" font-weight="400">原文・観測・AI解釈を分ける</text><text x="419" y="447" font-size="19" fill="#183248" font-weight="400">自作Cosense MCPで記録</text><rect x="45" y="340" width="310" height="145" rx="18" fill="#eaf4ef"/><text x="69" y="380" font-size="25" fill="#183248" font-weight="700">6  次の推薦へ</text><text x="69" y="418" font-size="19" fill="#183248" font-weight="400">好みの主軸と探索を分ける</text><text x="69" y="447" font-size="19" fill="#183248" font-weight="400">仮説は曲を聴いて検証する</text><path d="M745 412H718" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M395 412H368" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M195 340V293" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="45" y="535" width="1010" height="87" rx="18" fill="#f4f6f8"/><text x="70" y="571" font-size="21" fill="#183248" font-weight="400">未試聴は低評価にしない。聴けない便が続いたら、その回の新規配信を休む。</text><text x="70" y="602" font-size="19" fill="#526e81" font-weight="400">曲への反応が、次の選曲・説明・探索の仮説へ戻る。</text></g></svg>