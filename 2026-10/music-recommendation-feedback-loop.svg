<g font-size="22" font-weight="700" text-anchor="middle">
<text x="210" y="169">音楽ニュース</text><text x="600" y="169">Cosenseの記録</text><text x="990" y="169">Last.fmの聴取履歴</text>
<text x="210" y="363">ChatGPTが選ぶ</text><text x="600" y="363">Spotifyで聴く</text><text x="990" y="363">本人の反応</text>
<text x="210" y="565">全曲アーカイブ</text><text x="600" y="565">厳選した聴き返し</text><text x="990" y="565">Cosenseへ記録</text>
</g>
<g font-size="16" text-anchor="middle" fill="#466078">
<text x="210" y="199">新譜・地域・制作・文化</text>
<text x="600" y="199">設定／現在の嗜好／原文の感想</text>
<text x="990" y="199">自作MCPで曲と時刻を読む</text>
<text x="210" y="393">ニュース解説＋対応する実在曲</text>
<text x="600" y="393">日次便・保存・実収録確認</text>
<text x="990" y="393">Liked／感想／再生の記録</text>
<text x="210" y="596">未試聴・未保存の曲も残す</text>
<text x="600" y="596">Liked OR 明確な好反応</text>
<text x="990" y="596">観測・解釈・定着度を分ける</text>
</g>
