<g font-size="15" fill="#546b7f">
<text x="430" y="259">好みと実聴取を参照</text>
<text x="42" y="674">反応を次回へ戻す（弱い反復信号は、厳選への自動追加と分ける）</text>
<text x="78" y="757">直近3便とも配信後の再生がなければ、その回の新規ニュース＋プレイリストを休止。</text>
<text x="78" y="783">同期不足や本人の聴取申告を確認し、未再生を曲への負評価にはしない。</text>
