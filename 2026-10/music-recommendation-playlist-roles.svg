<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#627d8f"/></marker></defs><rect width="1100" height="680" fill="white"/><g font-family="sans-serif"><text x="45" y="58" font-size="32" fill="#183248" font-weight="700">今日聴く場所と、見つけた曲を残す場所</text><text x="45" y="94" font-size="20" fill="#526e81" font-weight="400">日次便の曲を、全曲アーカイブと聴き返し用へつなぐ</text><rect x="315" y="140" width="470" height="145" rx="18" fill="#eaf4ef"/><text x="339" y="180" font-size="25" fill="#183248" font-weight="700">日次プレイリスト</text><text x="339" y="218" font-size="19" fill="#183248" font-weight="400">ニュースの紹介順で聴く</text><text x="339" y="247" font-size="19" fill="#183248" font-weight="400">実収録・非公開・ライブラリ保存を確認</text><path d="M550 285V315H282V352" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M550 315H817V352" stroke="#627d8f" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="45" y="365" width="485" height="160" rx="18" fill="#eaf0fa"/><text x="69" y="405" font-size="25" fill="#183248" font-weight="700">全曲アーカイブ</text><text x="69" y="443" font-size="19" fill="#183248" font-weight="400">日次便の採用曲・明示した参考音源</text><text x="69" y="472" font-size="19" fill="#183248" font-weight="400">未試聴・未保存も残す／初期167曲</text><rect x="570" y="365" width="485" height="160" rx="18" fill="#fff0e5"/><text x="594" y="405" font-size="25" fill="#183248" font-weight="700">厳選した聴き返し</text><text x="594" y="443" font-size="19" fill="#183248" font-weight="400">アーカイブ内の Liked OR 明確な好反応</text><text x="594" y="472" font-size="19" fill="#183248" font-weight="400">再生だけでは自動追加しない／初期23曲</text><text x="45" y="574" font-size="21" fill="#183248" font-weight="400">アーカイブは新しい推薦日から。日内は紹介順。初期分はこの順で作成済み。</text><text x="45" y="611" font-size="19" fill="#526e81" font-weight="400">今後の先頭追加は未整備。続けて前日の曲が流れる再聴も、弱い補助信号にする。</text></g></svg>