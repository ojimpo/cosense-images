<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#627d8f"/></marker></defs><rect width="1100" height="670" fill="white"/><g font-family="sans-serif"><text x="45" y="58" font-size="32" fill="#183248" font-weight="700">「反応が確か」と「好みが定着」は別</text><text x="45" y="94" font-size="20" fill="#526e81" font-weight="400">Likedはその曲への強い肯定。ただし、ジャンル全体の長年の好みとは別</text><rect x="45" y="145" width="485" height="160" rx="18" fill="#eaf4ef"/><text x="69" y="185" font-size="25" fill="#183248" font-weight="700">長年好き ＋ 本人確認あり</text><text x="69" y="223" font-size="19" fill="#183248" font-weight="400">例：以前から好きなアーティスト</text><text x="69" y="252" font-size="19" fill="#183248" font-weight="400">→ 推薦の主軸として使う</text><rect x="570" y="145" width="485" height="160" rx="18" fill="#fff0e5"/><text x="594" y="185" font-size="25" fill="#183248" font-weight="700">保存・明確な単曲好反応</text><text x="594" y="223" font-size="19" fill="#183248" font-weight="400">例：推薦を聴いてLiked／これは良い</text><text x="594" y="252" font-size="19" fill="#183248" font-weight="400">→ その曲から近接曲やルーツを探す</text><rect x="45" y="350" width="485" height="160" rx="18" fill="#edf3f8"/><text x="69" y="390" font-size="25" fill="#183248" font-weight="700">実聴取の観測</text><text x="69" y="428" font-size="19" fill="#183248" font-weight="400">試聴・反復・日をまたぐ再訪</text><text x="69" y="457" font-size="19" fill="#183248" font-weight="400">→ 関心の補助信号。好きとは断定しない</text><rect x="570" y="350" width="485" height="160" rx="18" fill="#edf3f8"/><text x="594" y="390" font-size="25" fill="#183248" font-weight="700">AIの仮説</text><text x="594" y="428" font-size="19" fill="#183248" font-weight="400">「この要素が好きなのでは？」</text><text x="594" y="457" font-size="19" fill="#183248" font-weight="400">→ 未検証のまま、具体的な曲で試す</text><text x="45" y="566" font-size="22" fill="#183248" font-weight="400">同じ曲のコメントとLikedを二重加算しない。未保存・未再生は中立。</text><text x="45" y="602" font-size="20" fill="#526e81" font-weight="400">再生数だけで主軸へ昇格させず、本人の反応で支持・修正・保留を記録する。</text></g></svg>